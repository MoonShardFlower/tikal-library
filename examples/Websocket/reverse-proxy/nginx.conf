# nginx configuration as an alternative to the Caddyfile.
#
# Caddy is the recommended way (especially on Windows) because it's a single executable and handles TLS automatically.
# This block is here for people who already run nginx.
# It does the same job: HTTPS + HTTP Basic auth, forwarding to tikal on 127.0.0.1:8142.
#
# You'll need to provide your own certificate and password file:
#   - cert/key: use your own, or generate one (certbot for a public domain, mkcert for local).
#   - password: create with `htpasswd -c /etc/nginx/tikal.htpasswd tikal`
#
# The proxy_set_header lines for Upgrade/Connection are critical, without them WebSocket upgrades won't work.
# Do NOT add a `proxy_set_header Origin ...` -> tikal rejects any request that carries an Origin header.

server {
    listen 443 ssl;
    server_name toys.example.com;

    ssl_certificate     /etc/ssl/tikal.crt;
    ssl_certificate_key /etc/ssl/tikal.key;

    auth_basic           "tikal";
    auth_basic_user_file /etc/nginx/tikal.htpasswd;

    location / {
        proxy_pass http://127.0.0.1:8142;

        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
