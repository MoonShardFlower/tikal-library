[build-system]
requires = ["setuptools==84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tikal"
dynamic = ["version"]
description = "Toys I know and love: Unofficial Python Library to connect to and control Lovense Toys via Bluetooth"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "SnugglyBound", email = "SnugglyBound@gmail.com" }
]

dependencies = [
    "bleak==3.1.0",
    "pyserial-asyncio-fast==0.16",
    "pydantic==2.14.4",
    "websockets==17.4",
]

keywords = [
    "lovense",
    "bluetooth",
    "ble",
    "bleak",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = [
    "black~=26.10.1",
    "isort~=9.0.2",
    "pytest~=9.2.0",
    "pytest-asyncio~=1.5.0",
    "pytest-cov~=7.1.0",
    "flake8~=7.5.0",
    "mypy~=2.4.1",
]

[project.urls]
Homepage = "https://github.com/MoonShardFlower/tikal-library"
Repository = "https://github.com/MoonShardFlower/tikal-library"
Documentation = "https://tikal-library.readthedocs.io/en/latest/"
Changelog = "https://github.com/MoonShardFlower/tikal-library/blob/main/CHANGELOG.md"
Issues = "https://github.com/MoonShardFlower/tikal-library/issues"

[project.scripts]
tikal-server = "tikal.websocket.cli:main"

[tool.setuptools]
# tools/ holds development tools (the fake ToyServer), which are not part of the installed package
packages = { find = { exclude = ["tools*"] } }

[tool.setuptools.dynamic]
version = { attr = "tikal.__version__" }

[tool.setuptools.package-data]
tikal = ["py.typed"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.coverage.run]
# relative_files lets Codecov merge the coverage reports from the Windows and Linux CI and map them back to the repo
relative_files = true
source = ["tikal"]

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
