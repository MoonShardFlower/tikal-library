[build-system]
requires = ["setuptools>=82.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tikal"
dynamic = ["version"]
description = "Toys I know and love: Unofficial Python Library to connect to and control Lovense Toys via Bluetooth"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]

authors = [
    { name = "SnugglyBound", email = "SnugglyBound@gmail.com" }
]

dependencies = [
    "bleak~=2.1.1",
    "pyserial-asyncio-fast~=0.16",
    "pydantic~=2.13.4",
    "websockets~=16.0",
]

keywords = [
    "lovense",
    "bluetooth",
    "ble",
    "bleak",
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.optional-dependencies]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.0.0",
    "flake8>=7.3.0",
    "mypy>=2.1.0",
]

[project.urls]
Homepage = "https://github.com/MoonShardFlower/tikal-library"

[tool.setuptools]
packages = { find = {} }

[tool.setuptools.dynamic]
version = { attr = "tikal.__version__" }

[tool.setuptools.package-data]
tikal = ["py.typed"]

[tool.isort]
profile = "black"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[tool.mypy]
python_version = "3.13"
strict = true
ignore_missing_imports = true
